syntax = "proto3";

package gee.v1;

service ExecutionEngine {
    rpc Execute(stream CommandRequest)
        returns (stream CommandResponse);
}

enum CommandType {
    SQL = 0;
    FUNCTION = 1;
    PROCEDURE = 2;
}

message Parameter {
    string name = 1;

    oneof value {
        string string_value = 2;
        int64 int_value = 3;
        double double_value = 4;
        bool bool_value = 5;
        bytes bytes_value = 6;
    }
}

message CommandRequest {
    CommandType type = 1;

    string command = 2;

    repeated Parameter parameters = 3;
}

message CommandResponse {
    bool success = 1;

    string message = 2;

    bytes payload = 3;
}

